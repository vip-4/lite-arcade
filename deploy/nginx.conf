# ---------------------------------------------------------------
# Lite Arcade 生产级 nginx 配置（静态站点）
# 目标：安全头 + 长缓存 + gzip/brotli + SEO/GEO 资源正确 MIME
# ---------------------------------------------------------------

worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # ---------------- 压缩 ----------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/xml application/json
        application/javascript application/manifest+json image/svg+xml;

    # ---------------- MIME 补充（GEO 关键文件） ----------------
    types {
        text/plain                   txt md;
        application/manifest+json    webmanifest;
    }

    # ---------------- 限流 ----------------
    limit_req_zone $binary_remote_addr zone=static:10m rate=60r/s;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        charset utf-8;

        # ---------------- 安全响应头 ----------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
        add_header X-XSS-Protection       "0" always;
        add_header Content-Security-Policy
            "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'self'; form-action 'none'; frame-ancestors 'self'"
            always;

        limit_req zone=static burst=120 nodelay;

        # ---------------- SEO / GEO 机器可读入口 ----------------
        location = /robots.txt      { add_header Cache-Control "public, max-age=3600"; }
        location = /sitemap.xml     { add_header Cache-Control "public, max-age=3600"; }
        location = /llms.txt        { add_header Cache-Control "public, max-age=86400"; }
        location = /llms-full.txt   { add_header Cache-Control "public, max-age=86400"; }
        location = /humans.txt      { add_header Cache-Control "public, max-age=86400"; }
        location = /manifest.webmanifest { add_header Cache-Control "public, max-age=3600"; }

        # ---------------- 带指纹的静态资源：长缓存 ----------------
        location ~* ^/assets/.+\.(css|js|png|jpg|jpeg|webp|svg|woff2|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # ---------------- HTML：不缓存，便于内容更新被快速抓取 ----------------
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri $uri/ =404;
        }

        # ---------------- 目录尾斜杠规范化 ----------------
        location ~ ^/(games|about)/?$ { return 301 $scheme://$host$request_uri/; }

        location / {
            try_files $uri $uri/index.html $uri.html =404;
        }

        error_page 404 /404.html;
        error_page 500 502 503 504 /404.html;

        location = /404.html { internal; }
    }
}
