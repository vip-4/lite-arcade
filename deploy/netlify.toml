# ---------------------------------------------------------------
# Netlify 部署配置（静态站点，无构建命令）
# 构建产物由 deploy/build.ps1 生成，或直接在 CI 里跑 pwsh
# ---------------------------------------------------------------

[build]
  publish = "dist"
  command = "pwsh -NoProfile -Command ./deploy/build.ps1 -BaseUrl \"$URL\""

[build.environment]
  # Netlify 提供的正式站点 URL，用于 canonical / og:url / sitemap
  # 自定义域名请在 Netlify 后台绑定后覆盖 URL 变量

# ---------------- 安全头 ----------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'"

# ---------------- SEO / GEO 机器可读入口 ----------------
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ---------------- 带指纹静态资源长缓存 ----------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------- HTML 不缓存 ----------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# ---------------- 重定向：目录尾斜杠规范化 ----------------
[[redirects]]
  from = "/games"
  to   = "/games/"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to   = "/about/"
  status = 301
  force = true

# ---------------- 404 ----------------
[[redirects]]
  from = "/*"
  to   = "/404.html"
  status = 404
